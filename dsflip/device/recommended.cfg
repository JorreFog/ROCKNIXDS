# ROCKNIXDS's recommended settings for particular games, on top of the defaults (nds-settings.sh), for a game with
# "Apply recommended settings" on (#45). One game per line:
#   <ROM file name, a shell pattern, any case>|<key>=<value> [<key>=<value> ...]
# Keys are the system.cfg ones: power_profile (balanced, performance, battery), renderer (superdrastic, drastic),
# resolution3d (2x, 3x), texture_filter (nearest, bilinear, sharp), shader, hires_3d, threaded_3d, follow_3d_renderer.
# A later line that matches wins. Only what a measurement or a log in this repo shows goes here: say where.
#
# The 1.5 performance logs (docs/perf-logs-1.5.md): on balanced, Call of Duty ran at 22-56 fps with 84% of its play
# below 57 fps, The 4 Heroes of Light 50% of its play below 57 fps at 1416 MHz. Performance lets the clock go to
# 1992 MHz from the start, with the shortest frame queue.
call of duty - world at war*|power_profile=performance
final fantasy - the 4 heroes of light*|power_profile=performance
