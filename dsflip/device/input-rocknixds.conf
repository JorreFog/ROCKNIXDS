# ROCKNIXDS drop-in for ROCKNIX's volume-key service (input_sense). It runs outside the desktop session with no
# bus address, so its "Volume: N%" notification never reached mako (journal: "Connection Error: ... set your
# DBUS_SESSION_BUS_ADDRESS instead"; seen on the RG DS Plus nightly 20260930). The desktop's runtime dir and bus:
[Service]
Environment=XDG_RUNTIME_DIR=/var/run/0-runtime-dir
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/var/run/0-runtime-dir/bus
