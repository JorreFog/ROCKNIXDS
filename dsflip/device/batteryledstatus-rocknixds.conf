# ROCKNIXDS: ROCKNIX's RG DS battery LED monitor without starting processes every second (~6.5% of a core -> ~0.1%).
# Same behaviour; see /storage/.config/drastic/dsflip/battery-led-status. Delete this file to go back to ROCKNIX's.
[Service]
ExecStart=
ExecStart=/storage/.config/drastic/dsflip/battery-led-status
