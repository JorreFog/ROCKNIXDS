# ROCKNIXDS drop-in for ROCKNIX's sway-touch service. At boot it maps the touchscreen to the output that has focus,
# DSI-2 (the top panel) under the dual-screen menu. The RG DS Plus's one touchscreen is the bottom panel, and ROCKNIX's
# udev calibration (0.5 0 0.5 0 1 0) already puts it on DSI-1 within the whole layout: mapped to DSI-2, taps landed on
# the top panel, so neither the menu nor RetroArch's bottom-screen menu (lowerdeck) got them until a DS game restarted
# sway (issue #33). Off: the touchscreen stays on the whole layout, as sway starts it.
[Service]
ExecStart=
ExecStart=/bin/true
