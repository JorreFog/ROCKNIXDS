# ROCKNIXDS drop-in for ROCKNIX's sway-touch service. At boot it maps the touchscreen to the output that has focus,
# DSI-2 (the top panel) under the dual-screen menu. ROCKNIX's udev calibration already places the touch on the
# bottom panel within the whole layout: mapped to DSI-2, taps on the bottom panel landed on the top one, so neither
# the menu nor RetroArch's bottom-screen menu (lowerdeck) got them until a DS game restarted sway (issue #33; traced
# on the RG DS Plus). Off: the touchscreen stays on the whole layout, as sway starts it.
[Service]
ExecStart=
ExecStart=/bin/true
