# The DraStic engine (libdsflip) is built and released by SuperDrastic (https://github.com/JorreFog/SuperDrastic);
# install.sh installs the release pinned in SUPERDRASTIC (or the package shipped in dsflip/). This checks that the pinned package is there, matches its
# checksum and holds what install.sh takes from it, and that the scripts parse. The patched EmulationStation isn't
# built here: that needs ROCKNIX's whole build system.
name: check
on:
  push:
    branches: [beta, plus-beta, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The pinned SuperDrastic release
        run: |
          set -- $(grep -v '^#' SUPERDRASTIC); V=$1 SUM=$2
          # the package shipped in the tree, as install.sh uses it first; else the release
          if [ -f "dsflip/superdrastic-$V-aarch64.tar.gz" ]; then cp "dsflip/superdrastic-$V-aarch64.tar.gz" sd.tar.gz
          else curl -fsSL -o sd.tar.gz "https://github.com/JorreFog/SuperDrastic/releases/download/v$V/superdrastic-$V-aarch64.tar.gz"; fi
          echo "$SUM  sd.tar.gz" | sha256sum -c -
          tar tzf sd.tar.gz | grep -q '/libsuperdrastic.so$'
          tar tzf sd.tar.gz | grep -q '/shaders/ds-crisp.frag$'
      - name: Scripts parse
        run: |
          for f in install.sh dsflip/device/*.sh dsflip/device/fast-switch dsflip/device/powerstate dsflip/device/battery-led-status tools/*.sh; do
            case "$(head -n1 "$f")" in *bash*) bash -n "$f" ;; *) sh -n "$f" ;; esac || { echo "syntax error in $f"; exit 1; }
          done
