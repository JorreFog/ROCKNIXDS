<?xml version="1.0"?>
<!-- ROCKNIXDS's own apps, each a system of one entry, so each has a tile of its own on the menu's shelf instead of a
     line in Ports (ROCKNIXDS Pixel: rnds/systems.cfg gives them their icons, and "[app]" there makes A on the tile
     start the app). install.sh puts this file beside ES's own list (/storage/.config/emulationstation), where ES
     reads every es_systems_*.cfg. ES leaves a system without a file out, so a tile appears once its app is
     installed, by the app's own installer, which looks for this file and falls back to Ports without it:
       Döda Kvarter    the dodakvarter block of the installer on the game's branch
       ROCKNIXDS Bank  bank/device/install-bank.sh on the bank's branch
     They start as ROCKNIX's Ports do (runemu.sh -Pports). Platform "ignore" is ES's for a system that isn't a
     game console: no scraping, no emulator settings, and not in "Per system advanced configuration". -->
<systemList>
	<system>
		<name>dodakvarter</name>
		<fullname>Döda Kvarter</fullname>
		<manufacturer>ROCKNIXDS</manufacturer>
		<release>2026</release>
		<hardware>app</hardware>
		<path>/storage/.config/rocknixds/apps/dodakvarter</path>
		<extension>.sh</extension>
		<command>/usr/bin/runemu.sh %ROM% -Pports --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
		<platform>ignore</platform>
		<theme>ports</theme>
		<emulators>
			<emulator name="portmaster">
				<cores>
					<core default="true">portmaster</core>
				</cores>
			</emulator>
		</emulators>
	</system>
	<system>
		<name>rocknixdsbank</name>
		<fullname>Bank &amp; Trade</fullname>
		<manufacturer>ROCKNIXDS</manufacturer>
		<release>2026</release>
		<hardware>app</hardware>
		<path>/storage/.config/rocknixds/apps/bank</path>
		<extension>.sh</extension>
		<command>/usr/bin/runemu.sh %ROM% -Pports --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
		<platform>ignore</platform>
		<theme>ports</theme>
		<emulators>
			<emulator name="portmaster">
				<cores>
					<core default="true">portmaster</core>
				</cores>
			</emulator>
		</emulators>
	</system>
</systemList>
